[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdmm_filter_cuilab"
version = "0.1.0"
description = "Minimal batch workflow for binder-receptor preprocessing, explicit-solvent OpenMM MD, and AmberTools MMPBSA."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openmm"]

[project.scripts]
mdmm_filter_cuilab = "mdmm_filter_cuilab.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mdmm_filter_cuilab", "mdmm_filter_cuilab.*"]

[tool.setuptools.package-data]
mdmm_filter_cuilab = ["templates/*.in"]
